name: Probe Data API database context

on:
  workflow_dispatch:
    inputs:
      expected_runtime_sha:
        description: Full SHA of the currently healthy production runtime
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: data-api-resources-production
  cancel-in-progress: false

jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, veyocast, production]
    environment: production
    timeout-minutes: 5
    steps:
      - name: Remove prior database context readback
        id: clear_readbacks
        run: rm -f -- "$RUNNER_TEMP/data-api-resources.json"
      - name: Checkout trusted main revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          dest: ${{ runner.temp }}/veyocast-pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          version: 11.5.2
          run_install: false
      - name: Install pinned diagnostic client
        run: pnpm --filter veyocast-platform install --frozen-lockfile --child-concurrency=1
      - name: Read fixed scoped database context
        env:
          EXPECTED_RUNTIME_SHA: ${{ inputs.expected_runtime_sha }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/probe-data-api-resources.mjs "$EXPECTED_RUNTIME_SHA"
      - name: Retain sanitized database context
        if: always() && steps.clear_readbacks.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: data-api-resources-production-${{ github.run_id }}
          path: ${{ runner.temp }}/data-api-resources.json
          if-no-files-found: ignore
          retention-days: 14
