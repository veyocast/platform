<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Je bent uitgenodigd voor VeyoCast</title>
  </head>
  <body style="background:#f5f4f0;color:#161616;font-family:Arial,sans-serif;margin:0;padding:32px 16px">
    <main style="background:#fff;border:1px solid #dedbd3;border-radius:16px;margin:0 auto;max-width:560px;padding:32px">
      <p style="color:#6b655c;font-size:14px;font-weight:700;letter-spacing:.08em;margin:0 0 12px;text-transform:uppercase">VeyoCast Control</p>
      <h1 style="font-size:28px;line-height:1.2;margin:0 0 16px">Je bent uitgenodigd</h1>
      <p style="font-size:16px;line-height:1.6;margin:0 0 24px">Rond je persoonlijke uitnodiging af om veilig toegang te krijgen. Deze link is alleen voor {{ .Email }}.</p>
      <p style="margin:0 0 24px">
        <a href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=invite" style="background:#ff5a1f;border-radius:10px;color:#161616;display:inline-block;font-size:16px;font-weight:700;padding:14px 20px;text-decoration:none">Uitnodiging accepteren</a>
      </p>
      <p style="color:#6b655c;font-size:14px;line-height:1.5;margin:0">Heb je deze uitnodiging niet verwacht? Negeer deze e-mail en deel de link niet.</p>
    </main>
  </body>
</html>
