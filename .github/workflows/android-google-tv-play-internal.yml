name: Google TV Player Play internal

run-name: Google TV Player internal test from ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: android-google-tv-play-internal
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish Google TV internal AAB
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: android-tv-internal

    defaults:
      run:
        working-directory: apps/android-tv

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install pinned Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-37.1" "build-tools;36.0.0"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Validate protected release secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_TV_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TV_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_TV_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_TV_UPLOAD_KEY_PASSWORD }}
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          PLAY_SERVICE_ACCOUNT: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          missing=0
          for variable in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::GitHub Environment-secret ${variable} ontbreekt"
              missing=1
            fi
          done
          for variable in WORKLOAD_IDENTITY_PROVIDER PLAY_SERVICE_ACCOUNT; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::GitHub Environment-variabele ${variable} ontbreekt"
              missing=1
            fi
          done
          if (( missing != 0 )); then
            exit 1
          fi
          umask 077
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/veyocast-upload.jks"
          test -s "${RUNNER_TEMP}/veyocast-upload.jks"

      - name: Authenticate to Google Cloud without a stored service-account key
        id: google_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT }}

      - name: Derive monotonic Play version
        run: |
          if (( GITHUB_RUN_NUMBER < 1 || GITHUB_RUN_NUMBER > 999999 )); then
            echo "::error::Workflow-runnummer past niet meer in de gereserveerde Android TV versionCode-range"
            exit 1
          fi
          if (( GITHUB_RUN_ATTEMPT < 1 || GITHUB_RUN_ATTEMPT > 99 )); then
            echo "::error::Workflow-poging moet tussen 1 en 99 liggen om versionCode-botsingen te voorkomen"
            exit 1
          fi
          release_sequence=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          version_code=$((200000000 + release_sequence))
          if (( version_code < 200000000 || version_code > 299999999 )); then
            echo "::error::Afgeleide Android TV versionCode valt buiten 200000000–299999999"
            exit 1
          fi
          echo "VEYCAST_TV_VERSION_CODE=${version_code}" >> "${GITHUB_ENV}"
          echo "VEYCAST_TV_VERSION_NAME=1.0.0-internal.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_ENV}"

      - name: Lint, test and build signed Google TV bundle
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/veyocast-upload.jks
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_TV_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_TV_UPLOAD_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_TV_UPLOAD_KEY_PASSWORD }}
        run: >-
          ./gradlew
          :tv:lintProductionRelease
          :tv:testProductionDebugUnitTest
          :tv:bundleProductionRelease
          --no-daemon

      - name: Verify signed bundle and TV manifest policy
        run: |
          bundle="tv/build/outputs/bundle/productionRelease/tv-production-release.aab"
          source_manifest="tv/src/main/AndroidManifest.xml"
          test -s "${bundle}"
          jarsigner -verify -verbose -certs "${bundle}" > "${RUNNER_TEMP}/jarsigner-google-tv-report.txt"
          grep -Fq 'jar verified.' "${RUNNER_TEMP}/jarsigner-google-tv-report.txt"
          unzip -p "${bundle}" base/manifest/AndroidManifest.xml > "${RUNNER_TEMP}/google-tv-manifest.bin"
          strings "${RUNNER_TEMP}/google-tv-manifest.bin" | grep -Fq 'nl.veyocast.player'
          forbidden_id="nl.veyocast.player"".""tv"
          if strings "${RUNNER_TEMP}/google-tv-manifest.bin" | grep -Fq "${forbidden_id}"; then
            echo "::error::De TV-bundle gebruikt een verboden tweede applicationId"
            exit 1
          fi
          strings "${RUNNER_TEMP}/google-tv-manifest.bin" | grep -Fq 'android.software.leanback'
          grep -Fq 'android:name="android.software.leanback"' "${source_manifest}"
          grep -Fq 'android:required="true"' "${source_manifest}"
          grep -Fq 'android:name="android.hardware.touchscreen"' "${source_manifest}"
          grep -Fq 'android:required="false"' "${source_manifest}"
          grep -Fq 'android.intent.category.LEANBACK_LAUNCHER' "${source_manifest}"
          if grep -Fq 'android.intent.category.LAUNCHER' "${source_manifest}"; then
            echo "::error::De TV-bundle mag geen algemene mobiele launcher bevatten"
            exit 1
          fi
          if unzip -Z1 "${bundle}" | grep -Eq '^base/lib/.+\.so$'; then
            echo "::error::Native libraries vereisen een afzonderlijke ABI- en 16-KB-page-sizevalidatie"
            exit 1
          fi

      - name: Preserve signed Google TV artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: veyocast-google-tv-internal-${{ github.run_number }}
          path: |
            apps/android-tv/tv/build/outputs/bundle/productionRelease/tv-production-release.aab
            apps/android-tv/tv/build/outputs/mapping/productionRelease/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish to Google Play internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: ${{ steps.google_auth.outputs.credentials_file_path }}
          packageName: nl.veyocast.player
          releaseFiles: ${{ github.workspace }}/apps/android-tv/tv/build/outputs/bundle/productionRelease/tv-production-release.aab
          tracks: tv:qa
          status: completed
          releaseName: VeyoCast Player Android TV ${{ env.VEYCAST_TV_VERSION_NAME }}
          whatsNewDirectory: ${{ github.workspace }}/apps/android-tv/play-tv/release-notes
          mappingFile: ${{ github.workspace }}/apps/android-tv/tv/build/outputs/mapping/productionRelease/mapping.txt

      - name: Remove temporary signing material
        if: always()
        run: rm -f "${RUNNER_TEMP}/veyocast-upload.jks"
