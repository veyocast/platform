name: Android Player

on:
  pull_request:
    paths:
      - "apps/android-tv/**"
      - "apps/player/**"
      - "assets/brand/**"
      - ".github/workflows/android-tv.yml"
      - ".github/workflows/android-tv-play-internal.yml"
      - ".github/workflows/android-google-tv-play-internal.yml"
  push:
    branches:
      - main
    paths:
      - "apps/android-tv/**"
      - "apps/player/**"
      - "assets/brand/**"
      - ".github/workflows/android-tv.yml"
      - ".github/workflows/android-tv-play-internal.yml"
      - ".github/workflows/android-google-tv-play-internal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-tv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and build Android Player
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: apps/android-tv

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install pinned Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-37.1" "build-tools;36.0.0"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Android lint
        run: ./gradlew lint --no-daemon

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Build staging debug APK
        run: ./gradlew assembleStagingDebug --no-daemon

      - name: Build production debug APK
        run: ./gradlew assembleProductionDebug --no-daemon

      - name: Build Google TV debug APKs
        run: ./gradlew :tv:assembleStagingDebug :tv:assembleProductionDebug --no-daemon

      - name: Upload Android Player debug APKs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: veyocast-android-debug-apks
          path: |
            apps/android-tv/app/build/outputs/apk/staging/debug/*.apk
            apps/android-tv/app/build/outputs/apk/production/debug/*.apk
            apps/android-tv/tv/build/outputs/apk/staging/debug/*.apk
            apps/android-tv/tv/build/outputs/apk/production/debug/*.apk
          if-no-files-found: error
          retention-days: 14
