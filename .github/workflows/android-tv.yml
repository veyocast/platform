name: Android Player

on:
  pull_request:
    paths:
      - "apps/android-tv/**"
      - "apps/player/**"
      - "assets/brand/**"
      - ".github/workflows/android-tv.yml"
      - ".github/workflows/android-tv-play-internal.yml"
      - ".github/workflows/android-google-tv-play-internal.yml"
  push:
    branches:
      - main
    paths:
      - "apps/android-tv/**"
      - "apps/player/**"
      - "assets/brand/**"
      - ".github/workflows/android-tv.yml"
      - ".github/workflows/android-tv-play-internal.yml"
      - ".github/workflows/android-google-tv-play-internal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-tv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and build Android Player
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: apps/android-tv

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install pinned Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-37.1" "build-tools;36.0.0"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Android lint
        run: ./gradlew lint --no-daemon

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Build staging debug APK
        run: ./gradlew assembleStagingDebug --no-daemon

      - name: Build production debug APK
        run: ./gradlew assembleProductionDebug --no-daemon

      - name: Build Google TV debug APKs
        run: ./gradlew :tv:assembleStagingDebug :tv:assembleProductionDebug --no-daemon

      - name: Build and validate Google TV production bundle
        run: |
          bundletool_url="https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar"
          bundletool_path="${RUNNER_TEMP}/bundletool-all-1.18.3.jar"
          curl --fail --location --silent --show-error \
            --proto '=https' \
            --tlsv1.2 \
            "${bundletool_url}" \
            --output "${bundletool_path}"
          printf '%s  %s\n' \
            "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29" \
            "${bundletool_path}" \
            | sha256sum --check --status
          ./gradlew :tv:bundleProductionRelease \
            -PveyocastTvVersionCode=299999999 \
            -PveyocastTvVersionName=ci-launcher-validation \
            --no-daemon
          scripts/validate-tv-bundle.sh \
            "tv/build/outputs/bundle/productionRelease/tv-production-release.aab" \
            "${bundletool_path}" \
            "${ANDROID_HOME}/build-tools/36.0.0/dexdump" \
            "${RUNNER_TEMP}/tv-launcher-evidence"

      - name: Upload Android Player debug APKs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: veyocast-android-debug-apks
          path: |
            apps/android-tv/app/build/outputs/apk/staging/debug/*.apk
            apps/android-tv/app/build/outputs/apk/production/debug/*.apk
            apps/android-tv/tv/build/outputs/apk/staging/debug/*.apk
            apps/android-tv/tv/build/outputs/apk/production/debug/*.apk
            apps/android-tv/tv/build/outputs/bundle/productionRelease/*.aab
            ${{ runner.temp }}/tv-launcher-evidence/
          if-no-files-found: error
          retention-days: 14
