name: Database and RLS Gates

on:
  pull_request:
    paths:
      - "packages/database/**"
      - "supabase/**"
      - ".github/workflows/database-rls-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-rls-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Database and RLS gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.5.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: pnpm db:start

      - name: Reset database from migrations
        run: pnpm db:reset

      - name: Prove RLS isolation
        run: pnpm test:rls

      - name: Stop local Supabase
        if: always()
        run: pnpm db:stop
