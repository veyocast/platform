name: PR Gates

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation gates
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.5.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Lint bounded acceptance runners
        run: pnpm exec eslint scripts/current-publication-maintenance.mjs scripts/current-publication-maintenance.test.mjs scripts/publication-reclamation-evidence.mjs scripts/publication-reclamation-evidence.test.mjs scripts/run-browser-gates.mjs scripts/run-browser-gates.test.mjs scripts/run-local-publisher-gate.mjs scripts/verify-composition-concurrency.mjs scripts/verify-media-metadata-concurrency.mjs scripts/verify-sites-reference.mjs scripts/verify-sites-comparison.mjs scripts/verify-sync-comparison.mjs tests/helpers/sync-reference-runtime.mjs scripts/sites-case-inventory.mjs scripts/sites-case-inventory.test.mjs scripts/validate-compose-config.mjs scripts/runner-toolchain-policy.mjs scripts/runner-toolchain-policy.test.mjs scripts/probe-publication-runtime.mjs scripts/probe-publication-runtime.test.mjs scripts/publication-runtime-metadata.mjs scripts/publication-runtime-metadata.test.mjs scripts/publication-database-query.mjs scripts/publication-database-query.test.mjs scripts/smoke-player-pairing-recovery.test.mjs scripts/probe-with-quiesced-worker.test.mjs scripts/probe-runtime-database.mjs scripts/probe-runtime-database.test.mjs scripts/recover-postgrest-schema-cache.mjs scripts/recover-postgrest-schema-cache.test.mjs scripts/probe-data-api-resources.mjs scripts/probe-data-api-resources.test.mjs scripts/supabase-capacity-metrics.mjs scripts/supabase-capacity-metrics.test.mjs tests/e2e/sites-media-workflows-live.spec.ts playwright.config.ts --max-warnings=0

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test --concurrency=1

      - name: Validate bounded Data API recovery
        run: node --test scripts/recover-postgrest-schema-cache.test.mjs

      - name: Validate bounded native workflow rerequest
        run: |
          pnpm exec eslint scripts/recover-stuck-deploy.mjs scripts/recover-stuck-deploy.test.mjs --max-warnings=0
          node --test scripts/recover-stuck-deploy.test.mjs

      - name: Validate scoped database context
        run: node --test scripts/probe-data-api-resources.test.mjs scripts/supabase-capacity-metrics.test.mjs

      - name: Validate signed Ubuntu CI mirror fallback
        run: |
          pnpm exec eslint scripts/prepare-ubuntu-ci-mirrors.mjs scripts/prepare-ubuntu-ci-mirrors.test.mjs --max-warnings=0
          node --test scripts/prepare-ubuntu-ci-mirrors.test.mjs

      - name: Validate shared deployment serialization
        run: |
          pnpm exec eslint scripts/deployment-concurrency-policy.mjs scripts/deployment-concurrency-policy.test.mjs --max-warnings=0
          node --test scripts/deployment-concurrency-policy.test.mjs

      - name: Validate complete Player case isolation
        run: |
          pnpm exec eslint scripts/verify-player-shards.mjs scripts/player-fixtures.mjs scripts/player-fixtures.test.mjs --max-warnings=0
          node --test scripts/run-browser-gates.test.mjs scripts/player-fixtures.test.mjs
          shellcheck scripts/prepare-player-fixtures.sh

      - name: Validate isolated Worker runtime and real image
        run: |
          pnpm exec eslint scripts/prepare-worker-runtime.mjs scripts/prepare-worker-runtime.test.mjs scripts/smoke-worker-runtime.mjs scripts/ensure-build-capacity.test.mjs --max-warnings=0
          node --test scripts/prepare-worker-runtime.test.mjs scripts/ensure-build-capacity.test.mjs
          shellcheck scripts/test-worker-runtime-image.sh scripts/ensure-build-capacity.sh
          bash scripts/test-worker-runtime-image.sh

      - name: Build
        run: pnpm build --concurrency=1

      - name: Preserve the complete original Sites case set
        run: node --test scripts/sites-case-inventory.test.mjs

      - name: Preserve independent self-hosted runner toolchains
        run: node --test scripts/runner-toolchain-policy.test.mjs

      - name: Validate GitHub Actions workflows
        run: bash scripts/validate-github-actions.sh

      - name: Validate VPS deployment definitions
        run: bash scripts/validate-vps-deployment.sh

  player-fixtures:
    name: Prepare complete Player fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.5.2
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Use canonical HTTPS Ubuntu mirror for browser tools
        run: node scripts/prepare-ubuntu-ci-mirrors.mjs
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Render and seal all original complete videos
        run: bash scripts/prepare-player-fixtures.sh
      - name: Preserve verified shared fixtures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: player-fixtures-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/player-fixtures
          if-no-files-found: error
          retention-days: 14
      - name: Preserve failed fixture preparation
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: player-fixtures-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/player-fixtures
          if-no-files-found: ignore
          retention-days: 14

  browsers:
    name: Browser gates (${{ matrix.label }})
    runs-on: ubuntu-latest
    # Includes actual binary preparation and every isolated original case.
    # Individual test and encoder deadlines remain unchanged.
    timeout-minutes: ${{ matrix.group == 'player' && 135 || matrix.group == 'control' && 60 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: control, label: control, shardIndex: 1, shardCount: 1 }
          - { group: marketing, label: marketing, shardIndex: 1, shardCount: 1 }
          - { group: cross, label: cross, shardIndex: 1, shardCount: 1 }
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.5.2
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Marketing artifact
        if: matrix.group == 'marketing'
        run: pnpm --filter @veyocast/marketing build
      - name: Use canonical HTTPS Ubuntu mirror for browser tools
        run: node scripts/prepare-ubuntu-ci-mirrors.mjs
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify every discovered spec in the application group
        env:
          PLAYWRIGHT_GATE_GROUP: ${{ matrix.group }}
          PLAYWRIGHT_GATE_OUTPUT: ${{ runner.temp }}/browser-gates
          PLAYWRIGHT_PLAYER_SHARD_INDEX: ${{ matrix.shardIndex }}
          PLAYWRIGHT_PLAYER_SHARD_COUNT: ${{ matrix.shardCount }}
        run: node scripts/run-browser-gates.mjs
      - name: Preserve browser failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-gates-${{ matrix.group }}-${{ matrix.shardIndex }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-gates
          if-no-files-found: ignore
          retention-days: 14

  players:
    name: Browser gates (${{ matrix.label }})
    needs: player-fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 135
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: player, label: 'player 1/4', shardIndex: 1, shardCount: 4 }
          - { group: player, label: 'player 2/4', shardIndex: 2, shardCount: 4 }
          - { group: player, label: 'player 3/4', shardIndex: 3, shardCount: 4 }
          - { group: player, label: 'player 4/4', shardIndex: 4, shardCount: 4 }
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.5.2
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Player artifact
        run: pnpm --filter @veyocast/player build
      - name: Use canonical HTTPS Ubuntu mirror for browser tools
        run: node scripts/prepare-ubuntu-ci-mirrors.mjs
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Download complete source-bound fixtures
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: player-fixtures-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/player-fixtures
      - name: Verify every fixture byte and its workflow identity
        env:
          PLAYWRIGHT_FIXTURE_ROOT: ${{ runner.temp }}/player-fixtures
        run: node scripts/player-fixtures.mjs verify
      - name: Verify every discovered original Player case
        env:
          PLAYWRIGHT_GATE_GROUP: player
          PLAYWRIGHT_GATE_OUTPUT: ${{ runner.temp }}/browser-gates
          PLAYWRIGHT_PLAYER_SHARD_INDEX: ${{ matrix.shardIndex }}
          PLAYWRIGHT_PLAYER_SHARD_COUNT: ${{ matrix.shardCount }}
          S238_BACKGROUND_BINARIES: ${{ runner.temp }}/player-fixtures/backgrounds
          S285_ONZETROTS_BINARIES: ${{ runner.temp }}/player-fixtures/onzetrots-v1
          S286_ONZETROTS_BINARIES: ${{ runner.temp }}/player-fixtures/onzetrots-v9
        run: node scripts/run-browser-gates.mjs
      - name: Preserve Player case closure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: player-case-closure-${{ matrix.shardIndex }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-gates/player/case-closure.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve browser failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-gates-player-${{ matrix.shardIndex }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-gates
          if-no-files-found: ignore
          retention-days: 14

  player-closure:
    name: Browser gates (player)
    needs: [browsers, players]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require successful browser jobs
        env:
          BROWSER_RESULT: ${{ needs.browsers.result }}
          PLAYER_RESULT: ${{ needs.players.result }}
        run: test "$BROWSER_RESULT" = success && test "$PLAYER_RESULT" = success
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Download independent Player closures
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: player-case-closure-*-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/player-shard-reports
      - name: Prove complete original Player coverage
        env:
          PLAYWRIGHT_PLAYER_SHARD_REPORTS: ${{ runner.temp }}/player-shard-reports
          PLAYWRIGHT_PLAYER_SHARD_COUNT: '4'
          PLAYWRIGHT_PLAYER_CLOSURE_OUTPUT: ${{ runner.temp }}/player-combined-closure
        run: node scripts/verify-player-shards.mjs
      - name: Preserve combined Player closure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: player-combined-closure-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/player-combined-closure/case-closure.json
          if-no-files-found: error
          retention-days: 14
