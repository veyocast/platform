name: PR Gates

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation gates
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.5.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Lint bounded acceptance runners
        run: pnpm exec eslint scripts/current-publication-maintenance.mjs scripts/current-publication-maintenance.test.mjs scripts/publication-reclamation-evidence.mjs scripts/publication-reclamation-evidence.test.mjs scripts/run-browser-gates.mjs scripts/run-browser-gates.test.mjs scripts/run-local-publisher-gate.mjs scripts/verify-composition-concurrency.mjs scripts/verify-media-metadata-concurrency.mjs scripts/verify-sites-reference.mjs scripts/verify-sites-comparison.mjs scripts/sites-case-inventory.mjs scripts/sites-case-inventory.test.mjs scripts/validate-compose-config.mjs scripts/runner-toolchain-policy.mjs scripts/runner-toolchain-policy.test.mjs scripts/probe-publication-runtime.mjs scripts/probe-publication-runtime.test.mjs scripts/publication-runtime-metadata.mjs scripts/publication-runtime-metadata.test.mjs scripts/publication-database-query.mjs scripts/publication-database-query.test.mjs scripts/smoke-player-pairing-recovery.test.mjs scripts/probe-with-quiesced-worker.test.mjs scripts/probe-runtime-database.mjs scripts/probe-runtime-database.test.mjs scripts/recover-postgrest-schema-cache.mjs scripts/recover-postgrest-schema-cache.test.mjs scripts/probe-data-api-resources.mjs scripts/probe-data-api-resources.test.mjs tests/e2e/sites-media-workflows-live.spec.ts playwright.config.ts --max-warnings=0

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test --concurrency=1

      - name: Validate bounded Data API recovery
        run: node --test scripts/recover-postgrest-schema-cache.test.mjs

      - name: Validate scoped database context
        run: node --test scripts/probe-data-api-resources.test.mjs

      - name: Validate complete Player case isolation
        run: node --test scripts/run-browser-gates.test.mjs

      - name: Build
        run: pnpm build --concurrency=1

      - name: Preserve the complete original Sites case set
        run: node --test scripts/sites-case-inventory.test.mjs

      - name: Preserve independent self-hosted runner toolchains
        run: node --test scripts/runner-toolchain-policy.test.mjs

      - name: Validate GitHub Actions workflows
        run: bash scripts/validate-github-actions.sh

      - name: Validate VPS deployment definitions
        run: bash scripts/validate-vps-deployment.sh

  browsers:
    name: Browser gates (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [control, player, marketing, cross]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.5.2
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Player artifact
        if: matrix.group == 'player'
        run: pnpm --filter @veyocast/player build
      - name: Build Marketing artifact
        if: matrix.group == 'marketing'
        run: pnpm --filter @veyocast/marketing build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify every discovered spec in the application group
        env:
          PLAYWRIGHT_GATE_GROUP: ${{ matrix.group }}
          PLAYWRIGHT_GATE_OUTPUT: ${{ runner.temp }}/browser-gates
        run: node scripts/run-browser-gates.mjs
      - name: Preserve browser failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-gates-${{ matrix.group }}-${{ github.sha }}
          path: ${{ runner.temp }}/browser-gates
          if-no-files-found: ignore
          retention-days: 14
