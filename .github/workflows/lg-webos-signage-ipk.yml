name: LG webOS Signage IPK

on:
  pull_request:
    paths:
      - ".github/workflows/lg-webos-signage-ipk.yml"
      - "apps/lg-webos-signage/**"
      - "apps/player/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/lg-webos-signage-ipk.yml"
      - "apps/lg-webos-signage/**"
      - "apps/player/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:
    inputs:
      publish_https:
        description: Upload de release na approval naar de geconfigureerde HTTPS PUT-map
        required: true
        type: boolean
        default: false
      audit_public:
        description: Controleer de reeds uitgerolde immutable productie-URL
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: lg-webos-signage-ipk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate LG wrapper and hosted route
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.5.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned Signage CLI
        run: |
          test "$(node -p "require('./node_modules/@webos-tools/cli/package.json').version")" = "3.2.5"
          if grep -R "patchedDependencies" pnpm-workspace.yaml pnpm-lock.yaml; then
            echo "De officiële Signage-packager mag niet lokaal gepatcht zijn." >&2
            exit 1
          fi
          grep -F 'webOS-Packager-Version: x.y.x' node_modules/@webos-tools/cli/lib/package.js
          pnpm exec ares-config --profile signage
          pnpm exec ares-package --version

      - name: Validate and test IPK source
        run: |
          pnpm --filter @veyocast/lg-webos-signage validate
          pnpm --filter @veyocast/lg-webos-signage test
          pnpm --filter @veyocast/lg-webos-signage validate:publication
          pnpm --filter @veyocast/lg-webos-signage validate:hosted

      - name: Validate hosted LG route
        run: |
          pnpm --filter @veyocast/player typecheck
          pnpm --filter @veyocast/player test

  release:
    name: Inspect immutable release IPK
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: lg-webos-signage-release

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.5.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Inspect committed immutable Signage smoketest
        run: |
          pnpm exec ares-config --profile signage
          pnpm --filter @veyocast/lg-webos-signage validate:publication

      - name: Preserve full 1.0.1 forensic evidence
        run: |
          mkdir -p dist/lg-webos/evidence
          bash apps/lg-webos-signage/scripts/audit-public-ipk.sh \
            https://veyocast.nl/ipk/nl.veyocast.player.webos_1.0.1_all.ipk \
            apps/marketing/public/ipk/nl.veyocast.player.webos_1.0.1_all.ipk \
            dist/lg-webos/evidence/public-1.0.1
          bash apps/lg-webos-signage/scripts/compare-ipks.sh \
            apps/marketing/public/ipk/nl.veyocast.player.webos_1.0.0_all.ipk \
            apps/marketing/public/ipk/nl.veyocast.player.webos_1.0.1_all.ipk \
            dist/lg-webos/evidence/compare-1.0.0-1.0.1
          bash apps/lg-webos-signage/scripts/compare-ipks.sh \
            apps/marketing/public/ipk/nl.veyocast.player.webos_1.0.0_all.ipk \
            apps/marketing/public/ipk/nl.veyocast.player.webos.smoketest_1.0.2_all.ipk \
            dist/lg-webos/evidence/compare-1.0.0-smoketest-1.0.2
          pnpm exec ares-package -i \
            apps/marketing/public/ipk/nl.veyocast.player.webos.smoketest_1.0.2_all.ipk \
            > dist/lg-webos/evidence/smoketest-1.0.2-ares-package-info.txt
          pnpm exec ares-package -I \
            apps/marketing/public/ipk/nl.veyocast.player.webos.smoketest_1.0.2_all.ipk \
            > dist/lg-webos/evidence/smoketest-1.0.2-ares-package-info-detail.txt
          sha256sum \
            apps/marketing/public/ipk/nl.veyocast.player.webos.smoketest_1.0.2_all.ipk \
            > dist/lg-webos/evidence/smoketest-1.0.2.sha256

      - name: Preserve IPK and distribution metadata
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: veyocast-lg-webos-signage-${{ github.run_number }}
          path: |
            apps/marketing/public/ipk/nl.veyocast.player.webos.smoketest_1.0.2_all.ipk
            apps/marketing/public/ipk/checksums.sha256
            apps/marketing/public/ipk/latest.json
            apps/marketing/public/ipk/release-notes.json
            dist/lg-webos/evidence/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload approved release to configured HTTPS PUT directory
        if: github.event_name == 'workflow_dispatch' && inputs.publish_https
        env:
          DISTRIBUTION_BASE_URL: ${{ vars.LG_WEBOS_DISTRIBUTION_BASE_URL }}
          DISTRIBUTION_BEARER_TOKEN: ${{ secrets.LG_WEBOS_DISTRIBUTION_BEARER_TOKEN }}
        run: |
          if [[ ! "${DISTRIBUTION_BASE_URL:-}" =~ ^https:// ]]; then
            echo "::error::LG_WEBOS_DISTRIBUTION_BASE_URL ontbreekt of gebruikt geen HTTPS"
            exit 1
          fi
          if [[ -z "${DISTRIBUTION_BEARER_TOKEN:-}" ]]; then
            echo "::error::LG_WEBOS_DISTRIBUTION_BEARER_TOKEN ontbreekt"
            exit 1
          fi
          base="${DISTRIBUTION_BASE_URL%/}/"
          for artifact in \
            nl.veyocast.player.webos.smoketest_1.0.2_all.ipk \
            checksums.sha256 \
            latest.json \
            release-notes.json
          do
            curl \
              --fail-with-body \
              --retry 3 \
              --retry-all-errors \
              --request PUT \
              --header "Authorization: Bearer ${DISTRIBUTION_BEARER_TOKEN}" \
              --upload-file "apps/marketing/public/ipk/${artifact}" \
              "${base}${artifact}"
          done

      - name: Verify immutable public downloads
        if: github.event_name == 'workflow_dispatch' && inputs.publish_https
        run: pnpm --filter @veyocast/lg-webos-signage validate:downloads

      - name: Audit deployed immutable smoketest
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.publish_https &&
          inputs.audit_public
        run: |
          bash apps/lg-webos-signage/scripts/audit-public-ipk.sh \
            https://veyocast.nl/ipk/nl.veyocast.player.webos.smoketest_1.0.2_all.ipk \
            apps/marketing/public/ipk/nl.veyocast.player.webos.smoketest_1.0.2_all.ipk \
            dist/lg-webos/evidence/public-smoketest-1.0.2
