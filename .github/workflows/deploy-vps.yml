name: Deploy VPS

on:
  workflow_run:
    workflows: ["PR Gates"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: Doelomgeving
        required: true
        type: choice
        options:
          - staging
          - production
      ref:
        description: Commit-SHA of ref uit main om uit te rollen
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: castivo-vps-${{ github.event_name == 'workflow_run' && 'staging' || inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and deploy ${{ github.event_name == 'workflow_run' && 'staging' || inputs.environment }}
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on:
      - self-hosted
      - linux
      - x64
      - castivo-vps
      - ${{ github.event_name == 'workflow_run' && 'staging' || inputs.environment }}
    environment:
      name: ${{ github.event_name == 'workflow_run' && 'staging' || inputs.environment }}
      url: ${{ format('https://{0}', vars.CONTROL_HOST) }}
    timeout-minutes: 60
    env:
      TARGET_ENVIRONMENT: ${{ github.event_name == 'workflow_run' && 'staging' || inputs.environment }}

    steps:
      - name: Checkout approved revision
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}

      - name: Verify revision belongs to main
        id: revision
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          deployment_sha=$(git rev-parse HEAD)
          if [[ ! ${deployment_sha} =~ ^[0-9a-f]{40}$ ]]; then
            echo "De deploymentref kon niet naar een volledige commit-SHA worden opgelost." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${deployment_sha}" origin/main; then
            echo "Alleen commits uit main mogen worden uitgerold." >&2
            exit 1
          fi
          echo "deployment_sha=${deployment_sha}" >> "${GITHUB_OUTPUT}"
          echo "DEPLOYMENT_SHA=${deployment_sha}" >> "${GITHUB_ENV}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install pinned tooling
        run: pnpm install --frozen-lockfile

      - name: Validate environment configuration
        shell: bash
        env:
          CONTROL_BIND_PORT: ${{ vars.CONTROL_BIND_PORT }}
          CONTROL_HOST: ${{ vars.CONTROL_HOST }}
          DEVICE_LAB_ACCESS_TOKEN: ${{ secrets.DEVICE_LAB_ACCESS_TOKEN }}
          DEVICE_LAB_SESSION_SECRET: ${{ secrets.DEVICE_LAB_SESSION_SECRET }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          PLAYER_BIND_PORT: ${{ vars.PLAYER_BIND_PORT }}
          PLAYER_HOST: ${{ vars.PLAYER_HOST }}
          REVERSE_PROXY_NETWORK: ${{ vars.REVERSE_PROXY_NETWORK }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -Eeuo pipefail
          required=(
            CONTROL_BIND_PORT CONTROL_HOST DEVICE_LAB_ACCESS_TOKEN
            DEVICE_LAB_SESSION_SECRET NEXT_PUBLIC_SUPABASE_ANON_KEY
            NEXT_PUBLIC_SUPABASE_URL NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
            PLAYER_BIND_PORT PLAYER_HOST REVERSE_PROXY_NETWORK SUPABASE_DB_URL
            SUPABASE_PROJECT_REF SUPABASE_SERVICE_ROLE_KEY
          )
          for variable_name in "${required[@]}"; do
            if [[ -z ${!variable_name:-} ]]; then
              echo "GitHub variable of secret ontbreekt: ${variable_name}" >&2
              exit 1
            fi
          done

          expected_supabase_url="https://${SUPABASE_PROJECT_REF}.supabase.co"
          if [[ ${NEXT_PUBLIC_SUPABASE_URL%/} != "${expected_supabase_url}" ]]; then
            echo "NEXT_PUBLIC_SUPABASE_URL hoort niet bij SUPABASE_PROJECT_REF." >&2
            exit 1
          fi
          if [[ ${SUPABASE_DB_URL} != *"${SUPABASE_PROJECT_REF}"* ]]; then
            echo "SUPABASE_DB_URL hoort niet aantoonbaar bij SUPABASE_PROJECT_REF." >&2
            exit 1
          fi

          for port in "${CONTROL_BIND_PORT}" "${PLAYER_BIND_PORT}"; do
            if [[ ! ${port} =~ ^[0-9]+$ ]] || (( port < 1024 || port > 65535 )); then
              echo "Bindpoorten moeten unieke getallen tussen 1024 en 65535 zijn." >&2
              exit 1
            fi
          done
          if [[ ${CONTROL_BIND_PORT} == "${PLAYER_BIND_PORT}" ]]; then
            echo "Control en Player mogen niet dezelfde bindpoort gebruiken." >&2
            exit 1
          fi
          if [[ ${CONTROL_HOST} == "${PLAYER_HOST}" ]]; then
            echo "Control en Player moeten een verschillende publieke hostnaam hebben." >&2
            exit 1
          fi
          if [[ ! ${REVERSE_PROXY_NETWORK} =~ ^[a-zA-Z0-9][a-zA-Z0-9_.-]+$ ]]; then
            echo "REVERSE_PROXY_NETWORK is geen geldige Docker-netwerknaam." >&2
            exit 1
          fi

      - name: Create protected deployment files
        shell: bash
        env:
          CONTROL_BIND_PORT: ${{ vars.CONTROL_BIND_PORT }}
          CONTROL_HOST: ${{ vars.CONTROL_HOST }}
          DEVICE_LAB_ACCESS_TOKEN: ${{ secrets.DEVICE_LAB_ACCESS_TOKEN }}
          DEVICE_LAB_SESSION_SECRET: ${{ secrets.DEVICE_LAB_SESSION_SECRET }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          PLAYER_BIND_PORT: ${{ vars.PLAYER_BIND_PORT }}
          PLAYER_HOST: ${{ vars.PLAYER_HOST }}
          REVERSE_PROXY_NETWORK: ${{ vars.REVERSE_PROXY_NETWORK }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          app_env_file="${RUNNER_TEMP}/castivo-app-${TARGET_ENVIRONMENT}-${GITHUB_RUN_ID}.env"

          write_env() {
            local destination=$1
            local name=$2
            local value=$3
            if [[ ${value} == *$'\n'* || ${value} == *$'\r'* ]]; then
              echo "Meerdere regels zijn niet toegestaan voor ${name}." >&2
              exit 1
            fi
            printf '%s=%s\n' "${name}" "${value}" >> "${destination}"
          }

          write_env "${app_env_file}" CASTIVO_ENVIRONMENT "${TARGET_ENVIRONMENT}"
          write_env "${app_env_file}" CONTROL_BIND_PORT "${CONTROL_BIND_PORT}"
          write_env "${app_env_file}" CONTROL_HOST "${CONTROL_HOST}"
          write_env "${app_env_file}" DEPLOYMENT_SHA "${DEPLOYMENT_SHA}"
          write_env "${app_env_file}" DEVICE_LAB_ACCESS_TOKEN "${DEVICE_LAB_ACCESS_TOKEN}"
          write_env "${app_env_file}" DEVICE_LAB_SESSION_SECRET "${DEVICE_LAB_SESSION_SECRET}"
          write_env "${app_env_file}" MEDIA_WORKER_ID "media-worker:${TARGET_ENVIRONMENT}:1"
          write_env "${app_env_file}" NEXT_PUBLIC_SUPABASE_ANON_KEY "${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
          write_env "${app_env_file}" NEXT_PUBLIC_SUPABASE_URL "${NEXT_PUBLIC_SUPABASE_URL}"
          write_env "${app_env_file}" NEXT_SERVER_ACTIONS_ENCRYPTION_KEY "${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}"
          write_env "${app_env_file}" PLAYER_BIND_PORT "${PLAYER_BIND_PORT}"
          write_env "${app_env_file}" PLAYER_HOST "${PLAYER_HOST}"
          write_env "${app_env_file}" REVERSE_PROXY_NETWORK "${REVERSE_PROXY_NETWORK}"
          write_env "${app_env_file}" SUPABASE_SERVICE_ROLE_KEY "${SUPABASE_SERVICE_ROLE_KEY}"

          echo "APP_ENV_FILE=${app_env_file}" >> "${GITHUB_ENV}"
          echo "REVERSE_PROXY_NETWORK=${REVERSE_PROXY_NETWORK}" >> "${GITHUB_ENV}"

      - name: Validate and build release images
        shell: bash
        run: |
          set -Eeuo pipefail
          docker compose --env-file "${APP_ENV_FILE}" --file infra/vps/app.compose.yaml config --quiet
          docker compose --env-file "${APP_ENV_FILE}" --file infra/vps/app.compose.yaml build --pull

      - name: Preview and apply Supabase migrations
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/migrate-supabase.sh apply

      - name: Activate release
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! docker network inspect "${REVERSE_PROXY_NETWORK}" >/dev/null 2>&1; then
            docker network create "${REVERSE_PROXY_NETWORK}" >/dev/null
          fi
          docker compose --env-file "${APP_ENV_FILE}" --file infra/vps/app.compose.yaml up \
            --detach \
            --remove-orphans \
            --wait \
            --wait-timeout 240

      - name: Verify public health endpoints
        shell: bash
        env:
          CONTROL_HOST: ${{ vars.CONTROL_HOST }}
          PLAYER_HOST: ${{ vars.PLAYER_HOST }}
        run: |
          set -Eeuo pipefail
          control_response="${RUNNER_TEMP}/control-health-${GITHUB_RUN_ID}.json"
          player_response="${RUNNER_TEMP}/player-health-${GITHUB_RUN_ID}.json"
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "https://${CONTROL_HOST}/api/health" > "${control_response}"
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "https://${PLAYER_HOST}/api/health" > "${player_response}"
          node scripts/verify-deployment-health.mjs "${control_response}" "${player_response}"

      - name: Write deployment summary
        if: success()
        shell: bash
        env:
          CONTROL_HOST: ${{ vars.CONTROL_HOST }}
          PLAYER_HOST: ${{ vars.PLAYER_HOST }}
        run: |
          {
            echo "## ${TARGET_ENVIRONMENT} uitgerold"
            echo
            echo "- Commit: \`${DEPLOYMENT_SHA}\`"
            echo "- Control: https://${CONTROL_HOST}"
            echo "- Player: https://${PLAYER_HOST}"
            echo "- Supabase-migraties: gecontroleerd en toegepast vóór activatie"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove temporary deployment files
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -n ${APP_ENV_FILE:-} && ${APP_ENV_FILE} == "${RUNNER_TEMP}/castivo-app-"* ]]; then
            rm -f -- "${APP_ENV_FILE}"
          fi
          rm -f -- \
            "${RUNNER_TEMP}/control-health-${GITHUB_RUN_ID}.json" \
            "${RUNNER_TEMP}/player-health-${GITHUB_RUN_ID}.json"
