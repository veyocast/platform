name: veyocast-production

services:
  control:
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile
      target: control
      secrets:
        - next_server_actions_encryption_key
      args:
        DEPLOYMENT_SHA: ${DEPLOYMENT_SHA:?DEPLOYMENT_SHA ontbreekt}
        NEXT_PUBLIC_APP_URL: https://${CONTROL_HOST:?CONTROL_HOST ontbreekt}
        NEXT_PUBLIC_APP_VERSION: ${DEPLOYMENT_SHA}
        NEXT_PUBLIC_PLAYER_URL: https://${PLAYER_HOST:?PLAYER_HOST ontbreekt}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?NEXT_PUBLIC_SUPABASE_ANON_KEY ontbreekt}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?NEXT_PUBLIC_SUPABASE_URL ontbreekt}
    image: veyocast-control:${DEPLOYMENT_SHA}
    environment:
      DEPLOYMENT_SHA: ${DEPLOYMENT_SHA}
      NEXT_PUBLIC_APP_URL: https://${CONTROL_HOST}
      NEXT_PUBLIC_APP_VERSION: ${DEPLOYMENT_SHA}
      NEXT_PUBLIC_PLAYER_URL: https://${PLAYER_HOST}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:?NEXT_SERVER_ACTIONS_ENCRYPTION_KEY ontbreekt}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY ontbreekt}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks: [edge, backend]

  player:
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile
      target: player
      secrets:
        - next_server_actions_encryption_key
      args:
        DEPLOYMENT_SHA: ${DEPLOYMENT_SHA:?DEPLOYMENT_SHA ontbreekt}
        NEXT_PUBLIC_APP_URL: https://${CONTROL_HOST:?CONTROL_HOST ontbreekt}
        NEXT_PUBLIC_APP_VERSION: ${DEPLOYMENT_SHA}
        NEXT_PUBLIC_PLAYER_URL: https://${PLAYER_HOST:?PLAYER_HOST ontbreekt}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?NEXT_PUBLIC_SUPABASE_ANON_KEY ontbreekt}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?NEXT_PUBLIC_SUPABASE_URL ontbreekt}
    image: veyocast-player:${DEPLOYMENT_SHA}
    environment:
      DEPLOYMENT_SHA: ${DEPLOYMENT_SHA}
      DEVICE_LAB_ACCESS_TOKEN: ${DEVICE_LAB_ACCESS_TOKEN:?DEVICE_LAB_ACCESS_TOKEN ontbreekt}
      DEVICE_LAB_SESSION_SECRET: ${DEVICE_LAB_SESSION_SECRET:?DEVICE_LAB_SESSION_SECRET ontbreekt}
      NEXT_PUBLIC_APP_VERSION: ${DEPLOYMENT_SHA}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY ontbreekt}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks: [edge, backend]

  media-worker:
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile
      target: media-worker
    image: veyocast-media-worker:${DEPLOYMENT_SHA}
    environment:
      MEDIA_WORKER_ID: ${MEDIA_WORKER_ID:-media-worker:production:1}
      MEDIA_WORKER_LOCK_TIMEOUT_SECONDS: ${MEDIA_WORKER_LOCK_TIMEOUT_SECONDS:-900}
      MEDIA_WORKER_MAX_ATTEMPTS: ${MEDIA_WORKER_MAX_ATTEMPTS:-3}
      MEDIA_WORKER_POLL_INTERVAL_MS: ${MEDIA_WORKER_POLL_INTERVAL_MS:-2000}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
    restart: unless-stopped
    networks: [backend]

  caddy:
    image: caddy:2.10.2-alpine
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL ontbreekt}
      CONTROL_HOST: ${CONTROL_HOST}
      PLAYER_HOST: ${PLAYER_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_config:/config
      - caddy_data:/data
    depends_on:
      control:
        condition: service_healthy
      player:
        condition: service_healthy
    restart: unless-stopped
    networks: [edge]

networks:
  backend:
    internal: true
  edge:

volumes:
  caddy_config:
  caddy_data:

secrets:
  next_server_actions_encryption_key:
    environment: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
