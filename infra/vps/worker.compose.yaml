name: ${WORKER_COMPOSE_PROJECT_NAME:?WORKER_COMPOSE_PROJECT_NAME ontbreekt}

services:
  media-worker:
    image: veyocast-media-worker:${DEPLOYMENT_SHA:?DEPLOYMENT_SHA ontbreekt}
    environment:
      DEPLOYMENT_SHA: ${DEPLOYMENT_SHA}
      MEDIA_WORKER_LOCK_TIMEOUT_SECONDS: "60"
      MEDIA_WORKER_MAX_ATTEMPTS: "3"
      MEDIA_WORKER_POLL_INTERVAL_MS: "500"
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY ontbreekt}
      SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?NEXT_PUBLIC_SUPABASE_URL ontbreekt}
      VEYOCAST_ENVIRONMENT: ${VEYOCAST_ENVIRONMENT:?VEYOCAST_ENVIRONMENT ontbreekt}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 4
      start_period: 70s
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1536m
    cpus: 1.5
    stop_grace_period: 70s
    volumes:
      - worker-tmp:/tmp
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    restart: unless-stopped
    networks: [worker]

networks:
  worker:
    driver: bridge

volumes:
  worker-tmp:
