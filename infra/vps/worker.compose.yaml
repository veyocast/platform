name: ${WORKER_COMPOSE_PROJECT_NAME:?WORKER_COMPOSE_PROJECT_NAME ontbreekt}

services:
  media-worker:
    image: veyocast-media-worker:${DEPLOYMENT_SHA:?DEPLOYMENT_SHA ontbreekt}
    environment:
      DEPLOYMENT_SHA: ${DEPLOYMENT_SHA}
      MEDIA_WORKER_LOCK_TIMEOUT_SECONDS: "60"
      MEDIA_WORKER_MAX_ATTEMPTS: "3"
      MEDIA_WORKER_POLL_INTERVAL_MS: "500"
      MONITOR_CONTROL_URL: https://${CONTROL_HOST:?CONTROL_HOST ontbreekt}/api/health
      MONITOR_MARKETING_URL: ${MONITOR_MARKETING_URL:-}
      MONITOR_PLAYER_URL: https://${PLAYER_HOST:?PLAYER_HOST ontbreekt}/healthz
      PUBLISHER_SCHEDULE_POLL_INTERVAL_MS: "15000"
      SLACK_ALERT_WEBHOOK_URL: ${SLACK_ALERT_WEBHOOK_URL:-}
      SPORTLINK_CONFIG_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:?NEXT_SERVER_ACTIONS_ENCRYPTION_KEY ontbreekt}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY ontbreekt}
      SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?NEXT_PUBLIC_SUPABASE_URL ontbreekt}
      VEYOCAST_ENVIRONMENT: ${VEYOCAST_ENVIRONMENT:?VEYOCAST_ENVIRONMENT ontbreekt}
    healthcheck:
      test: ["CMD", "node", "-e", "try{const b=JSON.parse(require('node:fs').readFileSync('/tmp/veyocast-media-worker-ready.json','utf8'));const age=Date.now()-b.lastPollAt;const valid=b.service==='VeyoCast Media Worker'&&b.environment===process.env.VEYOCAST_ENVIRONMENT&&b.revision===process.env.DEPLOYMENT_SHA&&Number.isFinite(b.lastPollAt)&&age>=-5000&&age<=75000;if(!valid)process.exit(1)}catch{process.exit(1)}"]
      interval: 5s
      timeout: 3s
      retries: 4
      start_period: 70s
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1536m
    cpus: 1.5
    stop_grace_period: 70s
    volumes:
      - worker-tmp:/tmp
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    restart: unless-stopped
    networks: [worker]

networks:
  worker:
    driver: bridge

volumes:
  worker-tmp:
