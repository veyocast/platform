<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport" />
    <meta content="#121416" name="theme-color" />
    <title>VeyoCast is offline</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { align-items: center; background: #121416; color: #fff; display: flex; min-height: 100dvh; margin: 0; padding: 24px; }
      main { margin: auto; max-width: 420px; width: 100%; }
      img { display: block; height: auto; margin-bottom: 44px; width: 172px; }
      p:first-of-type { color: #ff5c20; font-size: 12px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
      h1 { font-size: clamp(32px, 8vw, 48px); letter-spacing: -.04em; line-height: 1.02; margin: 12px 0 16px; }
      p { color: #b7bcc1; font-size: 16px; line-height: 1.6; }
      button { background: #ff5c20; border: 0; border-radius: 8px; color: #0a0a0a; cursor: pointer; font: inherit; font-weight: 750; margin-top: 16px; min-height: 44px; padding: 0 18px; }
      button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img alt="VeyoCast" src="/brand/veyocast-logo-inverse.svg" />
      <p>Verbinding onderbroken</p>
      <h1>VeyoCast is tijdelijk offline</h1>
      <p>Je geauthenticeerde gegevens worden niet in de publieke app-cache bewaard. Controleer de verbinding en probeer daarna opnieuw.</p>
      <button onclick="window.location.reload()" type="button">Opnieuw proberen</button>
    </main>
  </body>
</html>
